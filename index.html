<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Object Detector</title>
    
    <!-- TensorFlow.js and COCO-SSD Object Detection Models -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
            font-family: Arial, sans-serif;
        }

        video {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1; display: none; 
        }

        #start-btn {
            position: absolute; z-index: 20; padding: 20px 40px; font-size: 22px;
            background-color: #ffcc00; color: black; border: none; border-radius: 12px;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.5);
        }

        #hud-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 0, 0, 0.7); border: 2px solid #ffcc00;
            padding: 15px; border-radius: 10px; color: white;
            backdrop-filter: blur(5px); display: none; min-width: 250px;
        }

        .hud-title {
            font-size: 18px; font-weight: bold; color: #ffcc00; margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px;
        }

        .object-data { 
            margin-bottom: 8px; font-size: 16px; text-transform: capitalize;
        }
        
        .object-data span { 
            font-weight: bold; color: #00ffcc; 
        }

        #loading-text {
            position: absolute; z-index: 25; color: white; font-size: 20px;
            font-weight: bold; display: none; text-shadow: 0 2px 5px black;
        }

        #error-msg {
            position: absolute; z-index: 30; color: #ff4444; font-size: 18px;
            text-align: center; background: rgba(0, 0, 0, 0.9);
            padding: 15px; border-radius: 8px; display: none;
        }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>
    <button id="start-btn">Tap to Start Object Scanner</button>
    <div id="loading-text">Loading AI Model... Please wait.</div>
    
    <div id="hud-panel">
        <div class="hud-title">AI Object Scanner Active</div>
        <div id="object-list">Scanning...</div>
    </div>

    <div id="error-msg"></div>

    <script>
        const videoElement = document.getElementById('camera-feed');
        const startBtn = document.getElementById('start-btn');
        const errorMsg = document.getElementById('error-msg');
        const hudPanel = document.getElementById('hud-panel');
        const objectList = document.getElementById('object-list');
        const loadingText = document.getElementById('loading-text');

        let aiModel = null;
        let isDetecting = false;

        // --- 1. THE OBJECT DETECTION LOOP ---
        async function detectObjects() {
            if (!isDetecting) return;

            // Only run detection if the video has loaded enough data
            if (videoElement.readyState >= 2) {
                // Get predictions from the TensorFlow model
                const predictions = await aiModel.detect(videoElement);
                
                objectList.innerHTML = ""; // Clear previous data

                if (predictions.length > 0) {
                    hudPanel.style.display = "block";
                    
                    predictions.forEach(prediction => {
                        // Math to convert decimal confidence to a percentage (e.g. 0.95 -> 95%)
                        const score = Math.round(prediction.score * 100);
                        
                        objectList.innerHTML += `
                            <div class="object-data">
                                Object: <span>${prediction.class}</span> <br>
                                Confidence: ${score}%
                            </div>
                        `;
                    });
                } else {
                    objectList.innerHTML = "No known objects detected...";
                }
            }

            // Loop this function for real-time scanning (using requestAnimationFrame for smooth UI)
            requestAnimationFrame(detectObjects);
        }

        // --- 2. CAMERA & FULLSCREEN INITIALIZATION ---
        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            loadingText.style.display = 'block';

            try {
                // 1. Request Fullscreen
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) await docElm.requestFullscreen();
                else if (docElm.webkitRequestFullscreen) await docElm.webkitRequestFullscreen();

                // 2. Lock Landscape
                if (screen.orientation && screen.orientation.lock) {
                    try { await screen.orientation.lock('landscape'); } 
                    catch (err) { console.warn("Orientation lock failed.", err); }
                }

                // 3. Start HD Camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                videoElement.srcObject = stream;
                videoElement.style.display = 'block';

                // 4. Load the TensorFlow AI Model (COCO-SSD)
                // We load it AFTER the button tap so the phone doesn't freeze on initial page load
                aiModel = await cocoSsd.load();
                
                loadingText.style.display = 'none';
                isDetecting = true;
                
                // Start the continuous AI scanning loop
                detectObjects();

            } catch (err) {
                loadingText.style.display = 'none';
                errorMsg.style.display = "block";
                errorMsg.innerHTML = "Error: " + err.message + "<br>Make sure you are using <strong>https://</strong>";
                console.error(err);
            }
        });
    </script>
</body>
</html>
