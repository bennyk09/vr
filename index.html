<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dual Hand AR Tracker - HD</title>
    
    <!-- MediaPipe Hands CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
            font-family: Arial, sans-serif;
        }

        video {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1; display: none; 
        }

        #start-btn {
            position: absolute; z-index: 20; padding: 20px 40px; font-size: 22px;
            background-color: #00ffcc; color: black; border: none; border-radius: 12px;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.5);
        }

        #hud-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 0, 0, 0.7); border: 2px solid #00ffcc;
            padding: 15px; border-radius: 10px; color: white;
            backdrop-filter: blur(5px); display: none; min-width: 200px;
        }

        .hud-title {
            font-size: 18px; font-weight: bold; color: #00ffcc; margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px;
        }

        .hand-data { margin-bottom: 8px; font-size: 16px; }
        .hand-data span { font-weight: bold; color: #ffcc00; }

        #error-msg {
            position: absolute; z-index: 25; color: #ff4444; font-size: 18px;
            text-align: center; background: rgba(0, 0, 0, 0.9);
            padding: 15px; border-radius: 8px; display: none;
        }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>
    <button id="start-btn">Tap to Start HD AI Camera</button>
    
    <div id="hud-panel">
        <div class="hud-title">AI System Active</div>
        <div id="hand-list"></div>
    </div>

    <div id="error-msg"></div>

    <script>
        const videoElement = document.getElementById('camera-feed');
        const startBtn = document.getElementById('start-btn');
        const errorMsg = document.getElementById('error-msg');
        const hudPanel = document.getElementById('hud-panel');
        const handList = document.getElementById('hand-list');

        function onResults(results) {
            handList.innerHTML = ""; 

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                hudPanel.style.display = "block";

                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    
                    // Invert Left and Right for back camera
                    let rawSide = results.multiHandedness[i].label;
                    let handSide = (rawSide === "Left") ? "Right" : "Left";

                    let fingersUp = 0;

                    // Thumb Detection (X-axis)
                    if (handSide === "Right") {
                        if (landmarks[4].x < landmarks[3].x) fingersUp++;
                    } else {
                        if (landmarks[4].x > landmarks[3].x) fingersUp++;
                    }

                    // Other 4 Fingers (Y-axis)
                    const tips = [8, 12, 16, 20]; 
                    const pips = [6, 10, 14, 18]; 

                    for (let f = 0; f < 4; f++) {
                        if (landmarks[tips[f]].y < landmarks[pips[f]].y) {
                            fingersUp++;
                        }
                    }

                    // Output to HUD
                    handList.innerHTML += `
                        <div class="hand-data">
                            ${handSide} Hand: <span>${fingersUp} Fingers</span>
                        </div>
                    `;
                }
            } else {
                hudPanel.style.display = "none"; 
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        // Keeping AI on Lite mode (0) so it doesn't lag the HD feed
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0, 
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        startBtn.addEventListener('click', async () => {
            try {
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) await docElm.requestFullscreen();
                else if (docElm.webkitRequestFullscreen) await docElm.webkitRequestFullscreen();

                if (screen.orientation && screen.orientation.lock) {
                    try { await screen.orientation.lock('landscape'); } 
                    catch (err) { console.warn("Orientation lock failed.", err); }
                }

                // --- CAMERA QUALITY RESTORED TO HD ---
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 1280,  // Restored to HD
                    height: 720,  // Restored to HD
                    facingMode: "environment" 
                });

                await camera.start();
                
                videoElement.style.display = 'block'; 
                startBtn.style.display = 'none';

            } catch (err) {
                errorMsg.style.display = "block";
                errorMsg.innerHTML = "Error: " + err.message + "<br>Use <strong>https://</strong>";
            }
        });
    </script>
</body>
</html>
