<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Screen Camera Preview</title>
    
    <style>
        /* Reset margins and prevent any scrolling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Make the video fill the entire viewport edge-to-edge */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Ensures no black borders; fills the screen completely */
            z-index: 1;
        }

        /* The UI Button */
        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 20px 40px;
            font-size: 22px;
            font-family: Arial, sans-serif;
            background-color: #00ffcc;
            color: black;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.5);
        }

        /* Error Messaging */
        #error-msg {
            position: absolute;
            z-index: 10;
            color: #ff4444;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- playsinline is crucial for iOS Safari so it doesn't open the native video player -->
    <video id="camera-feed" autoplay playsinline></video>
    
    <button id="start-btn">Tap to Start Camera</button>
    <div id="error-msg"></div>

    <script>
        const videoElement = document.getElementById('camera-feed');
        const startBtn = document.getElementById('start-btn');
        const errorMsg = document.getElementById('error-msg');

        async function startCamera() {
            try {
                // Request the mobile device's back camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } 
                });
                videoElement.srcObject = stream;
            } catch (err) {
                errorMsg.style.display = "block";
                errorMsg.innerHTML = "Camera Error: " + err.message + "<br><br>Ensure you are connecting via <strong>https://</strong>";
                console.error(err);
            }
        }

        // Mobile browsers require a physical tap to trigger Fullscreen mode
        startBtn.addEventListener('click', async () => {
            // Hide button on click
            startBtn.style.display = 'none';
            
            // 1. Boot up the camera
            await startCamera();

            // 2. Request immersive full screen (hides browser UI)
            try {
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) {
                    await docElm.requestFullscreen();
                } else if (docElm.webkitRequestFullscreen) { /* iOS Safari support */
                    await docElm.webkitRequestFullscreen();
                }
            } catch (err) {
                console.warn("Fullscreen API is not supported on this browser.", err);
            }
        });
    </script>
</body>
</html>
