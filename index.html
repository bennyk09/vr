<!DOCTYPE html>
<html>
<head>
    <title>E.D.I.T.H. // VR Iron Man HUD</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        .vr-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        .eye-viewport {
            position: relative;
            width: 50vw;
            height: 100vh;
            overflow: hidden;
            border-right: 2px solid #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 50vw;
            height: 100vh;
            object-fit: cover;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-sizing: border-box;
            border: 15px solid rgba(0, 200, 255, 0.15);
            box-shadow: inset 0 0 30px rgba(0, 200, 255, 0.4);
        }
        .hud-element {
            position: absolute;
            color: #00ffff;
            font-size: 10px;
            text-shadow: 0 0 6px #00ffff;
            letter-spacing: 1px;
        }
        .top-left { top: 20px; left: 20px; border-left: 2px solid #00ffff; padding-left: 8px; }
        .top-right { top: 20px; right: 20px; text-align: right; border-right: 2px solid #00ffff; padding-right: 8px; }
        .bottom-left { bottom: 20px; left: 20px; }
        .bottom-right { bottom: 20px; right: 20px; text-align: right; }
        
        .reticle {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 1px dashed rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            top: calc(50% - 50px);
            left: calc(50% - 50px);
            animation: spin 10s linear infinite;
        }
        .reticle-inner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #00ffff;
            top: calc(50% - 15px);
            left: calc(50% - 15px);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="vr-container">
        <!-- Left Eye -->
        <div class="eye-viewport">
            <img src="/video_feed" />
            <div class="overlay">
                <div class="hud-element top-left">SYS.IO: ACTIVE<br>PWR: 98.4%</div>
                <div class="hud-element top-right">MARK LXXXV<br>VR LINK ON</div>
                <div class="hud-element bottom-left">LAT: 37.7749</div>
                <div class="hud-element bottom-right">AI: E.D.I.T.H.</div>
                <div class="reticle"><div class="reticle-inner"></div></div>
            </div>
        </div>
        <!-- Right Eye -->
        <div class="eye-viewport">
            <img src="/video_feed" />
            <div class="overlay">
                <div class="hud-element top-left">SYS.IO: ACTIVE<br>PWR: 98.4%</div>
                <div class="hud-element top-right">MARK LXXXV<br>VR LINK ON</div>
                <div class="hud-element bottom-left">LAT: 37.7749</div>
                <div class="hud-element bottom-right">AI: E.D.I.T.H.</div>
                <div class="reticle"><div class="reticle-inner"></div></div>
            </div>
        </div>
    </div>
</body>
</html>
