<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Back Camera Preview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin-top: 30px;
            padding: 0 15px;
        }
        video {
            width: 100%;
            max-width: 500px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            background: #000;
        }
    </style>
</head>
<body>

    <h1>Back Camera Preview</h1>
    <!-- Video element to display camera stream -->
    <video id="camera-stream" autoplay playsinline></video>

    <script>
        async function startBackCamera() {
            const videoElement = document.getElementById('camera-stream');
            
            try {
                // Try forcing the back/environment camera first
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" }
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
            } catch (error) {
                console.warn("Exact back camera not found, falling back to general environment preference: ", error);
                
                try {
                    // Fallback to general environment preference without 'exact' restriction
                    const fallbackConstraints = {
                        video: {
                            facingMode: "environment"
                        }
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                    videoElement.srcObject = stream;
                } catch (fallbackError) {
                    console.error("Environment camera failed, trying any available camera: ", error);
                    
                    try {
                        // Last resort fallback to any camera available
                        const anyStream = await navigator.mediaDevices.getUserMedia({ video: true });
                        videoElement.srcObject = anyStream;
                    } catch (finalError) {
                        alert("Could not access any camera. Please check permissions and ensure you are using HTTPS or Localhost.");
                    }
                }
            }
        }

        // Run the function when the page loads
        startBackCamera();
    </script>

</body>
</html>
