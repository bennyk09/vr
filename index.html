<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Landscape Fullscreen Camera</title>
    
    <style>
        /* Reset all margins and prevent scrolling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 
           Video fills the entire screen. 
           Notice there is NO "transform: scaleX(-1)" here, so it will not mirror.
        */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            display: none; /* Hidden until started */
        }

        /* The UI Button */
        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 20px 40px;
            font-size: 22px;
            font-family: Arial, sans-serif;
            background-color: #00ffcc;
            color: black;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.5);
        }

        /* Error Messaging */
        #error-msg {
            position: absolute;
            z-index: 15;
            color: #ff4444;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- playsinline prevents iOS from opening its native media player -->
    <video id="camera-feed" autoplay playsinline></video>
    
    <button id="start-btn">Tap to Start Camera</button>
    <div id="error-msg"></div>

    <script>
        const videoElement = document.getElementById('camera-feed');
        const startBtn = document.getElementById('start-btn');
        const errorMsg = document.getElementById('error-msg');

        startBtn.addEventListener('click', async () => {
            try {
                // 1. Request Immersive Full Screen First
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) {
                    await docElm.requestFullscreen();
                } else if (docElm.webkitRequestFullscreen) { /* iOS Safari fallback */
                    await docElm.webkitRequestFullscreen();
                }

                // 2. Lock Screen to Landscape
                // Note: The Fullscreen API must be triggered before the Orientation API works
                if (screen.orientation && screen.orientation.lock) {
                    try {
                        await screen.orientation.lock('landscape');
                    } catch (err) {
                        console.warn("Orientation lock not supported or blocked on this device.", err);
                    }
                }

                // 3. Start the Unmirrored Back Camera
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" } // "environment" targets the true back camera
                    });
                    
                    videoElement.srcObject = stream;
                    videoElement.style.display = 'block'; // Reveal the video
                    startBtn.style.display = 'none';      // Hide the button
                } else {
                    throw new Error("Camera API not supported in this browser.");
                }

            } catch (err) {
                errorMsg.style.display = "block";
                errorMsg.innerHTML = "Error: " + err.message + "<br><br>Make sure you are using <strong>https://</strong>";
                console.error(err);
            }
        });
    </script>
</body>
</html>
